name: Publish

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      # setup-uv has no floating major tag (e.g. v10), so pin the exact release commit.
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Check tag matches package version
        run: |
          package_version="$(uv version --short)"
          if [ "${GITHUB_REF_NAME#v}" != "$package_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $package_version in pyproject.toml"
            exit 1
          fi
      - run: uv run pytest
      - run: uv build
      # Build once and publish the same files to both indexes, so what lands on
      # PyPI is byte-identical to what was smoke-tested on TestPyPI.
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  test-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
      contents: read
    steps:
      # pyproject.toml carries the [[tool.uv.index]] entry that --index resolves.
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      # --check-url skips files already uploaded, so re-running a failed release
      # does not block on "file already exists".
      - run: >-
          uv publish
          --index testpypi
          --trusted-publishing always
          --check-url https://test.pypi.org/simple/

  pypi:
    # PyPI only publishes if TestPyPI accepted the same artifacts first.
    needs: test-pypi
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - run: uv publish --trusted-publishing always
