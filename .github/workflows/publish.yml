name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      # setup-uv has no floating major tag (e.g. v10), so pin the exact release commit.
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Check tag matches package version
        run: |
          package_version="$(uv version --short)"
          if [ "${GITHUB_REF_NAME#v}" != "$package_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $package_version in pyproject.toml"
            exit 1
          fi
      - run: uv run pytest
      - run: uv build
      - run: uv publish --trusted-publishing always