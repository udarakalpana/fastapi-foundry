[project]
name = "fastapi-app"
version = "0.1.0"
description = "A CLI for scaffolding FastAPI projects."
readme = "README.md"
authors = [
    { name = "kalpana", email = "kalpanaudara058@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "typer>=0.27.2",
]

[project.scripts]
fastapi-app = "fastapi_app.cli:app"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
