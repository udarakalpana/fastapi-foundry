[project]
name = "fastapi-foundry"
version = "0.2.0"
description = "A CLI for scaffolding FastAPI projects."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "kalpana", email = "kalpanaudara058@gmail.com" }
]
requires-python = ">=3.12"
keywords = ["fastapi", "cli", "scaffold", "generator", "project-template"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "typer>=0.27.2",
]

[project.urls]
Homepage = "https://github.com/udarakalpana/fastapi-foundry"
Repository = "https://github.com/udarakalpana/fastapi-foundry"
Issues = "https://github.com/udarakalpana/fastapi-foundry/issues"

[project.scripts]
fastapi-foundry = "fastapi_foundry.cli:app"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true
